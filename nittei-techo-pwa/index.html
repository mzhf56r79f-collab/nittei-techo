<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日程手帳</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f4a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日程手帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 手帳の見開き — 左に月カレンダー、右にその日の予定。狭い画面では縦積み + 下から出る入力シート */
:root{
  --paper:#f6f7f9; --card:#ffffff; --ink:#1d2433; --muted:#6b7385; --line:#dde1e8;
  --accent:#2f4a8a; --accent-soft:#e6ebf6; --sun:#c8402f; --sat:#2f6fb8;
  --c-lab:#2f4a8a; --c-class:#2e7d5b; --c-plan:#b8752a; --c-me:#9a4a8c;
  --display:"Zen Old Mincho","Hiragino Mincho ProN",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12151c; --card:#1a1f29; --ink:#e7eaf0; --muted:#98a0b2; --line:#2c3341;
  --accent:#8fa8e6; --accent-soft:#232c42; --sun:#ef7a69; --sat:#79aef0;
  --c-lab:#8fa8e6; --c-class:#6cc39b; --c-plan:#e3a75e; --c-me:#d690c8; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12151c; --card:#1a1f29; --ink:#e7eaf0; --muted:#98a0b2; --line:#2c3341;
  --accent:#8fa8e6; --accent-soft:#232c42; --sun:#ef7a69; --sat:#79aef0;
  --c-lab:#8fa8e6; --c-class:#6cc39b; --c-plan:#e3a75e; --c-me:#d690c8; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{margin:0}
body{padding-top:calc(20px + env(safe-area-inset-top,0px)) !important;-webkit-tap-highlight-color:transparent}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tools .ghost{font-size:.78rem;padding:4px 10px}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:20px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
@media (max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}}

header.top{max-width:1040px;margin:0 auto 16px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.35rem;letter-spacing:.06em;margin:0}
.now{max-width:1040px;margin:0 auto 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:6px 20px;align-items:center}
@media (max-width:560px){.now{grid-template-columns:minmax(0,1fr)}}
.clock{display:flex;flex-direction:column;gap:2px;min-width:0}
.clock .tm{font-family:var(--mono);font-size:2.1rem;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock .tm small{font-size:1.1rem;color:var(--muted);margin-left:2px}
.clock .dt{font-size:.85rem;color:var(--muted)}
.nowside{display:flex;flex-direction:column;gap:8px;min-width:0}
.tzrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tzrow select{width:auto;max-width:100%;padding:5px 8px;font-size:.9rem;background:var(--paper)}
.tzdiff{font-size:.78rem;color:var(--muted);font-family:var(--mono)}
.locrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem;min-width:0}
.locrow svg{flex:none;color:var(--accent)}
.locrow .lt{overflow-wrap:anywhere;min-width:0}
.locrow .lt small{color:var(--muted);margin-left:4px}
.locrow .ghost{font-size:.78rem;padding:3px 10px}
.sync{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok .dot{background:var(--c-class)}

.cal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.month{font-family:var(--display);font-size:1.6rem;margin:0;font-variant-numeric:tabular-nums}
.month small{font-size:.9rem;color:var(--muted);margin-right:6px;font-family:var(--mono)}
.nav{display:flex;gap:6px}
.nav button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;min-height:34px}
.nav button:hover{background:var(--accent-soft)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.dow{font-size:.72rem;text-align:center;color:var(--muted);padding:4px 0;letter-spacing:.1em}
.dow.sun{color:var(--sun)}.dow.sat{color:var(--sat)}
.day{border:none;background:transparent;border-radius:8px;min-height:62px;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.day:hover{background:var(--accent-soft)}
.day.out{opacity:.35}
.day.sun .n{color:var(--sun)}.day.sat .n{color:var(--sat)}
.day .n{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-size:.9rem}
.day.today .n{border:1.5px solid var(--accent)}
.day.sel{background:var(--accent-soft)}
.day.sel .n{background:var(--accent);color:var(--card)}
.marks{display:flex;flex-direction:column;gap:3px;width:100%;padding:0 3px;align-items:stretch}
.marks i{height:4px;border-radius:2px;display:block}
.marks i.gap{background:transparent!important}
.marks i.fl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:-5px}
.marks i.fl.xl{margin-left:-6px}
.marks i.fr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:-5px}
.marks i.fr.xr{margin-right:-6px}
.marks b{font-size:.62rem;color:var(--muted);font-weight:400;line-height:1;text-align:center}

.agenda{display:flex;flex-direction:column;gap:14px}
.dayhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dayhead h2{font-family:var(--display);font-size:1.3rem;margin:0}
.dayhead span{color:var(--muted);font-size:.85rem}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--cat);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.ev:hover{border-color:var(--cat)}
.ev .t{font-family:var(--mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.35}
.ev .ttl{font-weight:500;overflow-wrap:anywhere}
.ev .meta{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.chip{display:inline-block;font-size:.7rem;padding:0 7px;border-radius:99px;background:var(--accent-soft);color:var(--cat);margin-right:6px;letter-spacing:.05em}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px}
.ghost:hover{border-color:var(--accent)}
.sub{font-size:.75rem;letter-spacing:.14em;color:var(--muted);margin:6px 0 0}
.up{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.up li button{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid var(--line);padding:8px 2px}
.up .d{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.up .x{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--card);border:none;border-radius:99px;padding:12px 20px;font-weight:700;box-shadow:0 6px 18px rgba(20,30,60,.25);z-index:5}

.overlay{position:fixed;inset:0;background:rgba(10,14,24,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:92%;overflow:auto}
@media (min-width:761px){.overlay{align-items:center}.sheet{border-radius:16px}}
.sheet h3{font-family:var(--display);margin:0 0 12px;font-size:1.2rem}
form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
input,select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px;min-width:0;width:100%}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 12px;color:var(--ink);font-size:.85rem;cursor:pointer}
.cats input{width:auto;accent-color:var(--accent)}
.cats label:has(input:checked){border-color:var(--cat);background:var(--accent-soft)}
.cats label .sw{width:10px;height:10px;border-radius:50%;background:var(--cat);flex:none}
.cats label input{position:absolute;opacity:0;pointer-events:none}
.cats label{position:relative}
.cats .x{border:none;background:transparent;color:var(--muted);padding:0 0 0 2px;font-size:.9rem;line-height:1}
.cats .x.armed{color:var(--sun);font-size:.72rem}
.cats .addcat{border:1px dashed var(--line);background:transparent;border-radius:99px;padding:4px 12px;font-size:.85rem;color:var(--muted)}
.cats .addcat:hover{border-color:var(--accent);color:var(--accent)}
.catbox{display:flex;flex-direction:column;gap:8px}
.catlbl{font-size:.8rem;color:var(--muted)}
.route{display:flex;flex-direction:column;gap:8px}
.route>.ghost{align-self:flex-start;font-size:.85rem}
.routebox{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--paper)}
.routebox input,.routebox select{background:var(--card)}
.routelinks{display:flex;gap:8px;flex-wrap:wrap}
.routelinks a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border-radius:8px;padding:8px 12px;font-size:.88rem;font-weight:500}
.routelinks a.y{background:var(--accent);color:var(--card)}
.routelinks a.g{border:1px solid var(--line);color:var(--ink);background:var(--card)}
.routelinks a[aria-disabled="true"]{opacity:.45;pointer-events:none}
.hint{font-size:.78rem;color:var(--muted);margin:0}
.rres{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:12px;display:flex;flex-direction:column;gap:8px}
.rsum{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.rmin{font-family:var(--mono);font-size:1.6rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.rmin small{font-size:.85rem;margin-left:2px;color:var(--muted)}
.rfare{font-family:var(--mono);font-size:1.15rem;font-weight:500;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;line-height:1.2}
.rfare small{font-size:.75rem;color:var(--muted);font-weight:400}
.rtr{font-size:.8rem;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.rlegs{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.rlegs span{color:var(--muted);font-size:.78rem;margin-left:6px}
.rnote{font-size:.75rem;color:var(--muted);margin:0}
.infolinks{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.8rem}
.infolinks .lbl{color:var(--muted)}
.infolinks a{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 10px}
.infolinks a:hover{border-color:var(--accent);color:var(--accent)}
.infolinks a::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lc)}
.infolinks a.cert{font-size:.75rem;color:var(--muted)}
.infolinks a.cert::before{display:none}
.fsel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end}
.swap{border:1px solid var(--line);background:var(--card);border-radius:8px;width:38px;height:38px;font-size:1rem}
.newcat{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--paper)}
.newcat input[type=text]{background:var(--card)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{width:28px;height:28px;border-radius:50%;background:var(--c);cursor:pointer;border:2px solid transparent;display:block;position:relative}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches label:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--card)}
.swatches label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.ncact{display:flex;gap:8px;justify-content:flex-end}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
.actions .r{display:flex;gap:8px;margin-left:auto}
.primary{background:var(--accent);color:var(--card);border:none;border-radius:8px;padding:8px 18px;font-weight:700}
.danger{background:transparent;color:var(--sun);border:1px solid var(--sun);border-radius:8px;padding:8px 12px}
.err{color:var(--sun);font-size:.82rem;margin:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>
</head>
<body>


<header class="top">
  <h1 class="brand">日程手帳</h1>
  <div class="tools"><div class="sync" id="sync"><span class="dot"></span><span id="syncText">読み込み中…</span></div><button class="ghost" id="fareBtn">運賃・時間</button><button class="ghost" id="exportBtn">バックアップ</button><button class="ghost" id="importBtn">復元</button><input type="file" id="importFile" accept="application/json,.json" hidden></div>
</header>

<section class="now" aria-label="現在時刻と現在地">
  <div class="clock">
    <div class="tm" id="clockTime" aria-live="off">--:--</div>
    <div class="dt" id="clockDate"></div>
  </div>
  <div class="nowside">
    <div class="tzrow">
      <select id="tzSel" aria-label="表示する地域の時刻"></select>
      <span class="tzdiff" id="tzDiff"></span>
    </div>
    <div class="locrow">
      <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
      <span class="lt" id="locText">現在地はまだ取得していません</span>
      <button class="ghost" id="locBtn" type="button">現在地を取得</button>
    </div>
    <div class="infolinks" id="nowInfo"></div>
  </div>
</section>

<main class="wrap">
  <section class="cal" aria-label="カレンダー">
    <div class="calhead">
      <h2 class="month" id="monthLabel"></h2>
      <div class="nav">
        <button id="prev" aria-label="前の月">‹</button>
        <button id="todayBtn">今日</button>
        <button id="next" aria-label="次の月">›</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="agenda" aria-label="予定">
    <div class="dayhead"><h2 id="dayTitle"></h2><span id="dayCount"></span></div>
    <ul class="list" id="dayList"></ul>
    <p class="sub">これからの予定</p>
    <ul class="up" id="upList"></ul>
  </section>
</main>

<button class="fab" id="addBtn">＋ 予定を追加</button>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <h3 id="formTitle">予定を追加</h3>
    <form id="form">
      <label>タイトル<input id="f-title" required maxlength="80" placeholder="例：研究室ミーティング"></label>
      <div class="row">
        <label>開始日<input id="f-date" type="date" required></label>
        <label>終了日（任意）<input id="f-enddate" type="date"></label>
      </div>
      <div class="row">
        <label>開始時刻<input id="f-start" type="time"></label>
        <label>終了時刻<input id="f-end" type="time"></label>
      </div>
      <label>場所<input id="f-place" maxlength="60" placeholder="任意（駅名を入れると行き方を調べやすくなります）"></label>
      <div class="route">
        <button type="button" class="ghost" id="routeBtn" aria-expanded="false">電車の行き方・料金を調べる</button>
        <div class="routebox" id="routeBox" hidden>
          <div class="row">
            <label>出発<input id="r-from" maxlength="40" placeholder="例：飯田橋"></label>
            <label>到着<input id="r-to" maxlength="60" placeholder="例：神楽坂"></label>
          </div>
          <div class="row">
            <label>時刻の指定<select id="r-type"><option value="4">到着時刻</option><option value="1">出発時刻</option><option value="now">今すぐ出発</option></select></label>
            <label>時刻<input id="r-time" type="time"></label>
          </div>
          <div id="r-calc"></div>
          <div class="routelinks">
            <a class="y" id="r-yahoo" href="#" target="_blank" rel="noopener">Yahoo!乗換案内で調べる</a>
            <a class="g" id="r-google" href="#" target="_blank" rel="noopener">Googleマップで調べる</a>
          </div>
          <p class="hint" id="r-hint">Yahoo!乗換案内では、乗る電車・乗り換え・所要時間・運賃が出ます。出発駅は次回のために保存されます。</p>
        </div>
      </div>
      <div class="catbox">
        <span class="catlbl">カテゴリ</span>
        <div class="cats" id="f-cats" role="radiogroup" aria-label="カテゴリ"></div>
        <div class="newcat" id="newCat" hidden>
          <input type="text" id="nc-name" maxlength="12" placeholder="カテゴリ名（例：バイト、サークル）" aria-label="新しいカテゴリ名">
          <div class="swatches" id="nc-colors" role="radiogroup" aria-label="色"></div>
          <div class="ncact"><button type="button" class="ghost" id="nc-cancel">やめる</button><button type="button" class="primary" id="nc-ok">カテゴリを追加</button></div>
        </div>
      </div>
      <label>メモ<textarea id="f-memo" rows="3" maxlength="500"></textarea></label>
      <p class="err" id="f-err" hidden></p>
      <div class="actions">
        <button type="button" class="danger" id="delBtn" hidden>削除</button>
        <div class="r">
          <button type="button" class="ghost" id="cancelBtn">キャンセル</button>
          <button type="submit" class="primary">保存</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="fareOverlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fareTitle">
    <h3 id="fareTitle">運賃・所要時間</h3>
    <form id="fareForm" onsubmit="return false">
      <p class="hint">常磐線（上野〜取手）と東武アーバンパークライン（大宮〜船橋）の駅どうしで計算します。柏での乗り換えにも対応しています。</p>
      <div class="fsel">
        <label>出発<select id="fa-from"></select></label>
        <button type="button" class="swap" id="fa-swap" aria-label="出発と到着を入れ替える">⇄</button>
        <label>到着<select id="fa-to"></select></label>
      </div>
      <div id="fa-result"></div>
      <div class="actions"><div class="r"><button type="button" class="ghost" id="fa-close">閉じる</button></div></div>
    </form>
  </div>
</div>

<script>
/* ---------- 運賃・所要時間（常磐線・東武アーバンパークライン） ----------
   出典: 営業キロ … 各線の駅一覧（日暮里起点・大宮起点）
         JR運賃 … JR東日本「運賃改定のご案内」2026年3月14日改定後の幹線運賃表
         東武運賃 … 東武鉄道 対キロ運賃表（2023年3月18日改定、バリアフリー料金込み）
   所要時間は目安（常磐線は時刻表から、東武は駅間距離からの推定） */
const RAIL={
  updated:"2026年11月",
  jrFare:[[3,155,160],[6,199,200],[10,209,210],[15,253,260],[20,341,350],[25,440,440],[30,528,530],[35,616,620],[40,715,720],[45,803,810],[50,902,910],[60,1034,1040]],
  tobuFare:[[4,157,160],[7,178,180],[10,209,210],[15,261,270],[20,324,330],[25,377,380],[30,429,430],[35,481,490],[40,534,540],[45,607,610],[50,670,670],[60,743,750],[70,827,830]],
  // [駅名, 営業キロ]  JRは日暮里起点（上野は日暮里の2.2km手前）
  jrKm:{"上野":-2.2,"日暮里":0,"三河島":1.2,"南千住":3.4,"北千住":5.2,"綾瀬":7.7,"亀有":9.9,"金町":11.8,"松戸":15.7,"北松戸":17.8,"馬橋":19.1,"新松戸":20.7,"北小金":22.0,"南柏":24.5,"柏":26.9,"北柏":29.2,"我孫子":31.3,"天王台":34.0,"取手":37.4},
  tobuKm:{"大宮":0,"北大宮":1.2,"大宮公園":2.2,"大和田":4.0,"七里":5.6,"岩槻":8.5,"東岩槻":10.9,"豊春":12.2,"八木崎":14.1,"春日部":15.2,"藤の牛島":17.8,"南桜井":20.6,"川間":22.9,"七光台":25.1,"清水公園":26.6,"愛宕":27.7,"野田市":28.6,"梅郷":30.9,"運河":33.2,"江戸川台":35.1,"初石":36.8,"流山おおたかの森":38.4,"豊四季":39.7,"柏":42.9,"新柏":45.8,"増尾":47.1,"逆井":48.0,"高柳":50.2,"六実":51.9,"新鎌ヶ谷":53.3,"鎌ヶ谷":55.2,"馬込沢":57.7,"塚田":60.1,"新船橋":61.3,"船橋":62.7},
  // 運転系統: [名前, 会社, 駅と駅間分]
  services:[
    {id:"jrR",name:"常磐線快速",co:"JR",seq:["上野",4,"日暮里",2,"三河島",3,"南千住",2,"北千住",10,"松戸",9,"柏",4,"我孫子",3,"天王台",4,"取手"]},
    {id:"jrL",name:"常磐線各駅停車",co:"JR",seq:["北千住",3,"綾瀬",3,"亀有",3,"金町",4,"松戸",4,"北松戸",2,"馬橋",3,"新松戸",2,"北小金",3,"南柏",3,"柏",3,"北柏",2,"我孫子",4,"天王台",4,"取手"]},
    {id:"td",name:"東武アーバンパークライン（各停）",co:"東武",seq:null},
    {id:"tdx",name:"東武アーバンパークライン（急行）",co:"東武",seq:null,stops:["大宮","岩槻","春日部","藤の牛島","南桜井","川間","七光台","清水公園","愛宕","野田市","梅郷","運河","流山おおたかの森","柏","高柳","新鎌ヶ谷","船橋"]}
  ],
  sameCoTransfer:3, otherCoTransfer:6
};
(function buildTobu(){
  // 駅間の所要時間を距離から推定（柏より大宮側は単線区間が多く遅め）。実際の時刻表の柏〜船橋・柏〜大宮で調整済み
  const K=RAIL.tobuKm,north=n=>K[n]<=K["柏"];
  const mk=(names,local)=>{const seq=[names[0]];
    for(let i=1;i<names.length;i++){const d=K[names[i]]-K[names[i-1]],n=north(names[i]);
      seq.push(local?(n?0.9+d*1.0:1.0+d*1.1):(n?1.0+d*0.98:0.5+d*0.85),names[i])}return seq};
  RAIL.services[2].seq=mk(Object.keys(K),true);
  RAIL.services[3].seq=mk(RAIL.services[3].stops,false);
})();
const RAIL_STATIONS=(()=>{const s=new Set();for(const sv of RAIL.services)for(let i=0;i<sv.seq.length;i+=2)s.add(sv.seq[i]);return s})();
function normStation(x){return String(x||"").trim().replace(/[（(].*?[)）]/g,"").replace(/駅$/,"").replace(/ケ/g,"ヶ")}
function fareFor(table,km){const k=Math.ceil(km-1e-9);for(const [max,ic,tk] of table)if(k<=max)return{ic,tk};return null}
function railRoute(fromName,toName){
  const A=normStation(fromName),B=normStation(toName);
  if(!RAIL_STATIONS.has(A)||!RAIL_STATIONS.has(B)||A===B)return null;
  // 状態 = 駅@系統 のダイクストラ
  const adj={};const key=(st,sv)=>st+"@"+sv;
  const add=(a,b,w,info)=>{(adj[a]=adj[a]||[]).push({to:b,w,info})};
  const at={};
  for(const sv of RAIL.services){const q=sv.seq;
    for(let i=0;i<q.length;i+=2){(at[q[i]]=at[q[i]]||[]).push(sv)}
    for(let i=0;i+2<q.length;i+=2){const a=key(q[i],sv.id),b=key(q[i+2],sv.id);add(a,b,q[i+1],{sv,ride:true});add(b,a,q[i+1],{sv,ride:true})}}
  for(const st in at){const list=at[st];for(const s1 of list)for(const s2 of list)if(s1!==s2)
    add(key(st,s1.id),key(st,s2.id),s1.co===s2.co?RAIL.sameCoTransfer:RAIL.otherCoTransfer,{transfer:true})}
  const dist={},prev={},done=new Set();const pq=[];
  for(const sv of at[A]){const k=key(A,sv.id);dist[k]=0;pq.push(k)}
  const targets=new Set(at[B].map(sv=>key(B,sv.id)));let end=null;
  while(pq.length){pq.sort((x,y)=>dist[x]-dist[y]);const u=pq.shift();if(done.has(u))continue;done.add(u);
    if(targets.has(u)){end=u;break}
    for(const e of adj[u]||[]){const nd=dist[u]+e.w;if(dist[e.to]===undefined||nd<dist[e.to]-1e-9){dist[e.to]=nd;prev[e.to]={from:u,e};pq.push(e.to)}}}
  if(!end)return null;
  // 経路を区間ごとにまとめる
  const steps=[];let cur=end;while(prev[cur]){steps.unshift({...prev[cur],to:cur});cur=prev[cur].from}
  const legs=[];
  for(const s of steps){if(!s.e.info.ride)continue;const sv=s.e.info.sv;const fromSt=s.from.split("@")[0],toSt=s.to.split("@")[0];
    const last=legs[legs.length-1];
    if(last&&last.sv===sv&&last.to===fromSt){last.to=toSt;last.min+=s.e.w;last.stops++}else legs.push({sv,from:fromSt,to:toSt,min:s.e.w,stops:1})}
  // 運賃: 会社ごとに連続区間のキロで計算して合計
  const parts=[];
  for(const l of legs){const co=l.sv.co;const last=parts[parts.length-1];
    if(last&&last.co===co&&last.to===l.from){last.to=l.to}else parts.push({co,from:l.from,to:l.to})}
  let ic=0,tk=0;const fareParts=[];
  for(const p of parts){const kmTab=p.co==="JR"?RAIL.jrKm:RAIL.tobuKm;const km=Math.abs(kmTab[p.to]-kmTab[p.from]);
    const f=fareFor(p.co==="JR"?RAIL.jrFare:RAIL.tobuFare,km);if(!f)return null;ic+=f.ic;tk+=f.tk;fareParts.push({...p,km,...f})}
  return{from:A,to:B,minutes:Math.round(dist[end]),legs:legs.map(l=>({line:l.sv.name,co:l.sv.co,from:l.from,to:l.to,min:Math.round(l.min),stops:l.stops})),ic,tk,fareParts,transfers:legs.length-1};
}
const RAIL_INFO={
  JR:{name:"常磐線",status:"https://traininfo.jreast.co.jp/train_info/kanto.aspx#direction_jouban",cert:"https://traininfo.jreast.co.jp/delay_certificate/",color:"var(--c-class)"},
  "東武":{name:"アーバンパークライン",status:"https://www.tobu.co.jp/service_status/",cert:"https://www.tobu.co.jp/railway/useful/delay/",color:"var(--c-lab)"}
};
function infoLinksHTML(cos,withCert){
  return `<div class="infolinks"><span class="lbl">運行情報</span>${cos.map(c=>{const i=RAIL_INFO[c];return `<a href="${i.status}" target="_blank" rel="noopener" style="--lc:${i.color}">${i.name}</a>`}).join("")}${withCert?cos.map(c=>`<a class="cert" href="${RAIL_INFO[c].cert}" target="_blank" rel="noopener">${RAIL_INFO[c].name}の遅延証明書</a>`).join(""):""}</div>`;
}
function railHTML(r){
  if(!r)return"";
  const legs=r.legs.map(l=>`<li><b>${l.line}</b> ${l.from} → ${l.to}<span>約${l.min}分・${l.stops}駅</span></li>`).join("");
  const fp=r.fareParts.length>1?`<p class="rnote">運賃の内訳：${r.fareParts.map(p=>`${p.co} ${p.from}〜${p.to}（${p.km.toFixed(1)}km）IC ${p.ic}円`).join("＋")}</p>`:`<p class="rnote">${r.fareParts[0].co} ${r.fareParts[0].km.toFixed(1)}km</p>`;
  return `<div class="rres"><div class="rsum"><span class="rmin">約${r.minutes}<small>分</small></span><span class="rfare">IC ${r.ic.toLocaleString()}円<small>きっぷ ${r.tk.toLocaleString()}円</small></span><span class="rtr">${r.transfers?`乗換${r.transfers}回`:"乗換なし"}</span></div><ol class="rlegs">${legs}</ol>${fp}${infoLinksHTML([...new Set(r.legs.map(l=>l.co))],false)}<p class="rnote">所要時間は待ち時間を含まない目安です。遅延がある場合は実際の時間が長くなります。運賃は${RAIL.updated}時点の公式運賃表から計算しています。</p></div>`;
}

const CATS={lab:{name:"研究",v:"--c-lab"},class:{name:"授業",v:"--c-class"},plan:{name:"予定",v:"--c-plan"},me:{name:"個人",v:"--c-me"}};
const PALETTE=["#d0563f","#d99a1e","#3a93a8","#5f9a3a","#7a5cc2","#c95c8c","#6b7a8f","#e07b39"];
const CKEY="schedule-cats-v1";
let customCats=(()=>{try{const a=JSON.parse(localStorage.getItem(CKEY)||"[]");return Array.isArray(a)?a:[]}catch(e){return[]}})();
function saveCats(){try{localStorage.setItem(CKEY,JSON.stringify(customCats))}catch(e){}}
function getCat(id){if(CATS[id])return{id,name:CATS[id].name,color:`var(${CATS[id].v})`,builtin:true};
  const c=customCats.find(x=>x.id===id);return c?{id,name:c.name,color:c.color,builtin:false}:{id:"plan",name:CATS.plan.name,color:`var(${CATS.plan.v})`,builtin:true}}
function allCats(){return[...Object.keys(CATS).map(getCat),...customCats.map(c=>getCat(c.id))]}
const WD=["日","月","火","水","木","金","土"];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=ymd(new Date());
let view=new Date(); view.setDate(1);
let sel=today, events=[], editing=null, store=null, ready=false;

/* ---------- 保存先：db（アカウントに同期）→ 使えなければこの端末 ---------- */
const LKEY="schedule-events-v1";
const local={
  load(){try{return JSON.parse(localStorage.getItem(LKEY)||"[]")}catch(e){return[]}},
  save(){try{localStorage.setItem(LKEY,JSON.stringify(events))}catch(e){}},
  async put(ev){const i=events.findIndex(e=>e.id===ev.id);i<0?events.push(ev):events[i]=ev;this.save();render()},
  async del(id){events=events.filter(e=>e.id!==id);this.save();render()}
};
function setSync(ok,text){$("sync").classList.toggle("ok",ok);$("syncText").textContent=text}

function init(){
  store=local;events=local.load();ready=true;
  setSync(true,"この端末に保存");render();
}

  const blob=new Blob([JSON.stringify({app:"nittei-techo",version:2,categories:customCats,events},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="日程手帳-"+today+".json";

$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const j=JSON.parse(await f.text());const list=Array.isArray(j)?j:j.events;
    if(!Array.isArray(list))throw 0;
    if(Array.isArray(j.categories)){for(const c of j.categories){if(c&&c.id&&c.name&&/^#[0-9a-f]{6}$/i.test(c.color||"")&&!CATS[c.id]&&!customCats.some(x=>x.id===c.id)){customCats.push({id:String(c.id),name:String(c.name).slice(0,12),color:c.color})}}saveCats()}
    let n=0;for(const ev of list){if(ev&&ev.title&&/^\d{4}-\d{2}-\d{2}$/.test(ev.date||"")){
      const id=ev.id||("e"+Date.now().toString(36)+n);const i=events.findIndex(x=>x.id===id);
      const clean={id,title:String(ev.title),date:ev.date,endDate:(/^\d{4}-\d{2}-\d{2}$/.test(ev.endDate||"")&&ev.endDate>ev.date)?ev.endDate:"",start:ev.start||"",end:ev.end||"",place:ev.place||"",memo:ev.memo||"",cat:(CATS[ev.cat]||customCats.some(c=>c.id===ev.cat))?ev.cat:"plan"};
      i<0?events.push(clean):events[i]=clean;n++}}
    local.save();render();setSync(true,n+"件を復元しました");
  }catch(err){setSync(false,"読み込めないファイルです")}
  e.target.value="";
};

/* ---------- 描画 ---------- */
const endOf=e=>e.endDate&&e.endDate>e.date?e.endDate:e.date;
const isMulti=e=>endOf(e)!==e.date;
function byTime(a,b){return (isMulti(b)-isMulti(a))||a.date.localeCompare(b.date)||(a.start||"").localeCompare(b.start||"")||a.title.localeCompare(b.title)}
function eventsOn(d){return events.filter(e=>e.date<=d&&endOf(e)>=d).sort(byTime)}
const md=k=>{const d=parse(k);return (d.getMonth()+1)+"/"+d.getDate()};
/* 1週間ぶんの予定を段（レーン）に割り当て、連日の予定が同じ高さでつながるようにする */
function layoutWeek(keys){
  const first=keys[0],last=keys[6];
  const evs=events.filter(e=>e.date<=last&&endOf(e)>=first).sort((a,b)=>
    (isMulti(b)-isMulti(a))||a.date.localeCompare(b.date)||endOf(b).localeCompare(endOf(a))||(a.start||"").localeCompare(b.start||""));
  const lanes=[];const cells=keys.map(()=>({slots:[],hidden:0}));
  for(const e of evs){
    const c0=e.date<first?0:keys.indexOf(e.date),c1=endOf(e)>last?6:keys.indexOf(endOf(e));
    let L=0;while(lanes[L]&&lanes[L].slice(c0,c1+1).some(Boolean))L++;
    lanes[L]=lanes[L]||Array(7).fill(null);
    for(let c=c0;c<=c1;c++){lanes[L][c]=e;
      if(L<3)cells[c].slots[L]={e,fl:e.date<keys[c],xl:c>0,fr:endOf(e)>keys[c],xr:c<6};else cells[c].hidden++}
  }
  return cells;
}
function catColor(c){return getCat(c).color}

function render(){
  const y=view.getFullYear(),m=view.getMonth();
  $("monthLabel").innerHTML=`<small>${y}</small>${m+1}月`;
  const g=$("grid");g.textContent="";
  WD.forEach((w,i)=>{const el=document.createElement("div");el.className="dow"+(i==0?" sun":i==6?" sat":"");el.textContent=w;g.appendChild(el)});
  const start=new Date(y,m,1-new Date(y,m,1).getDay());
  const weeks=Math.ceil((new Date(y,m,1).getDay()+new Date(y,m+1,0).getDate())/7);
  let week=null;
  for(let i=0;i<weeks*7;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const k=ymd(d);
    if(i%7===0){const ks=[];for(let j=0;j<7;j++){const x=new Date(d);x.setDate(d.getDate()+j);ks.push(ymd(x))}week=layoutWeek(ks)}
    const cell=week[i%7];
    const b=document.createElement("button");
    b.className="day"+(d.getMonth()!==m?" out":"")+(d.getDay()==0?" sun":d.getDay()==6?" sat":"")+(k===today?" today":"")+(k===sel?" sel":"");
    const evs=eventsOn(k);
    b.setAttribute("aria-label",`${d.getMonth()+1}月${d.getDate()}日 予定${evs.length}件`);
    b.innerHTML=`<span class="n">${d.getDate()}</span><span class="marks">${Array.from({length:cell.slots.length},(_,L)=>{const t=cell.slots[L];if(!t)return '<i class="gap"></i>';
      const cls=[t.fl&&"fl",t.fl&&t.xl&&"xl",t.fr&&"fr",t.fr&&t.xr&&"xr"].filter(Boolean).join(" ");
      return `<i class="${cls}" style="background:${catColor(t.e.cat)}"></i>`}).join("")}${cell.hidden?`<b>+${cell.hidden}</b>`:""}</span>`;
    b.onclick=()=>{sel=k;if(d.getMonth()!==m){view=new Date(d.getFullYear(),d.getMonth(),1)}render()};
    g.appendChild(b);
  }
  // 選択日
  const sd=parse(sel);
  $("dayTitle").textContent=`${sd.getMonth()+1}月${sd.getDate()}日（${WD[sd.getDay()]}）`;
  const list=eventsOn(sel);
  $("dayCount").textContent=ready?(list.length?`${list.length}件`:""):"";
  const ul=$("dayList");ul.textContent="";
  if(!ready){ul.innerHTML=`<li class="empty">予定を読み込んでいます…</li>`}
  else if(!list.length){
    const li=document.createElement("li");li.className="empty";
    li.innerHTML=events.length?`<span>この日の予定はありません。</span>`:`<span>まだ予定がありません。右下の「予定を追加」から最初の予定を登録できます。</span>`;
    const b=document.createElement("button");b.className="ghost";b.textContent="この日に予定を追加";b.onclick=()=>openForm(null,sel);li.appendChild(b);
    if(!events.length){const s=document.createElement("button");s.className="ghost";s.textContent="サンプル予定を入れて試す";s.onclick=addSamples;li.appendChild(s)}
    ul.appendChild(li);
  }else list.forEach(e=>ul.appendChild(evItem(e)));
  // 今後
  const up=events.filter(e=>endOf(e)>=today).sort((a,b)=>a.date.localeCompare(b.date)||byTime(a,b)).slice(0,6);
  const ol=$("upList");ol.textContent="";
  if(ready&&!up.length){ol.innerHTML=`<li style="color:var(--muted);font-size:.85rem;padding:6px 2px">予定はまだありません</li>`}
  up.forEach(e=>{const d=parse(e.date);const li=document.createElement("li");const b=document.createElement("button");
    b.innerHTML=`<span class="d">${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})</span><span class="x"></span>`;
    b.querySelector(".x").textContent=(isMulti(e)?"〜"+md(endOf(e))+" ":(e.start?e.start+" ":""))+e.title;
    b.onclick=()=>{sel=e.date<today&&isMulti(e)?today:e.date;const s2=parse(sel);view=new Date(s2.getFullYear(),s2.getMonth(),1);render()};li.appendChild(b);ol.appendChild(li)});
}
function evItem(e){
  const li=document.createElement("li");const b=document.createElement("button");b.className="ev";b.style.setProperty("--cat",catColor(e.cat));
  const tcol=isMulti(e)?`${md(e.date)}${e.start?" "+e.start:""}<br>–${md(endOf(e))}${e.end?" "+e.end:""}`:(e.start?e.start+(e.end?"<br>–"+e.end:""):"終日");
  b.innerHTML=`<span class="t">${tcol}</span><span><span class="ttl"></span><div class="meta"><span class="chip"></span><span class="pl"></span></div></span>`;
  b.querySelector(".ttl").textContent=e.title;b.querySelector(".chip").textContent=getCat(e.cat).name;
  b.querySelector(".pl").textContent=[e.place,e.memo].filter(Boolean).join(" · ");
  b.onclick=()=>openForm(e);li.appendChild(b);return li;
}

/* ---------- 入力シート ---------- */
function renderCats(selected){
  const box=$("f-cats");box.textContent="";
  for(const c of allCats()){
    const l=document.createElement("label");l.style.setProperty("--cat",c.color);
    const inp=document.createElement("input");inp.type="radio";inp.name="cat";inp.id="cat-"+c.id;inp.value=c.id;inp.checked=c.id===selected;
    const sw=document.createElement("span");sw.className="sw";
    const t=document.createElement("span");t.textContent=c.name;
    l.append(inp,sw,t);
    if(!c.builtin){
      const x=document.createElement("button");x.type="button";x.className="x";x.textContent="×";x.setAttribute("aria-label",c.name+"を削除");
      x.onclick=ev=>{ev.preventDefault();ev.stopPropagation();
        if(!x.classList.contains("armed")){x.classList.add("armed");x.textContent="削除?";setTimeout(()=>{x.classList.remove("armed");x.textContent="×"},3000);return}
        customCats=customCats.filter(k=>k.id!==c.id);saveCats();
        const cur=(document.querySelector('input[name="cat"]:checked')||{}).value;
        renderCats(cur===c.id?"lab":cur);render()};
      l.appendChild(x);
    }
    box.appendChild(l);
  }
  const add=document.createElement("button");add.type="button";add.className="addcat";add.textContent="＋ カテゴリを追加";
  add.onclick=()=>{$("newCat").hidden=false;$("nc-name").value="";
    const used=new Set(customCats.map(c=>c.color));const pick=PALETTE.find(p=>!used.has(p))||PALETTE[0];
    $("nc-colors").querySelectorAll("input").forEach(i=>i.checked=i.value===pick);$("nc-name").focus()};
  box.appendChild(add);
}
$("nc-colors").innerHTML=PALETTE.map((p,i)=>`<label style="--c:${p}" title="色${i+1}"><input type="radio" name="nccolor" id="ncc-${i}" value="${p}" aria-label="色${i+1}"></label>`).join("");
function addCategory(){
  const name=$("nc-name").value.trim();

$("nc-cancel").onclick=()=>{$("newCat").hidden=true};

function openForm(e,date){

/* ---------- 乗換案内 ---------- */
const FROMKEY="schedule-from-v1";
function resetRoute(){
  $("routeBox").hidden=true;$("routeBtn").setAttribute("aria-expanded","false");
}
$("routeBtn").onclick=()=>{
  const open=$("routeBox").hidden;$("routeBox").hidden=!open;$("routeBtn").setAttribute("aria-expanded",String(open));
  if(open){
    try{$("r-from").value=$("r-from").value||localStorage.getItem(FROMKEY)||""}catch(e){}
    $("r-to").value=$("f-place").value.trim();
    const st=$("f-start").value;
    $("r-type").value=st?"4":"now";$("r-time").value=st;
    updateRoute();
    (!$("r-from").value?$("r-from"):$("r-to")).focus();
  }
};
function updateRoute(){
  const from=$("r-from").value.trim(),to=$("r-to").value.trim(),type=$("r-type").value;
  $("r-calc").innerHTML=railHTML(railRoute(from,to));
  $("r-time").disabled=type==="now";
  let d,hh,mm;
  if(type==="now"){const n=new Date();d=n;hh=n.getHours();mm=n.getMinutes()}
  else{d=parse($("f-date").value||sel);const t=($("r-time").value||"09:00").split(":");hh=+t[0];mm=+t[1]}
  const q=new URLSearchParams({from,to,y:String(d.getFullYear()),m:pad(d.getMonth()+1),d:pad(d.getDate()),hh:String(hh),m1:String(Math.floor(mm/10)),m2:String(mm%10),type:type==="now"?"1":type,ticket:"ic"});
  const y=$("r-yahoo"),g=$("r-google");
  y.href="https://transit.yahoo.co.jp/search/result?"+q.toString();
  y.setAttribute("aria-disabled",String(!(from&&to)));
  const gq=new URLSearchParams({api:"1",destination:to,travelmode:"transit"});if(from)gq.set("origin",from);
  g.href="https://www.google.com/maps/dir/?"+gq.toString();
  g.setAttribute("aria-disabled",String(!to));
  $("r-hint").textContent=!to?"到着に行き先（駅名や施設名）を入れてください。":!from?"出発駅を入れるとYahoo!乗換案内で調べられます。Googleマップは空欄なら現在地から調べます。":"Yahoo!乗換案内では、乗る電車・乗り換え・所要時間・運賃が出ます。出発駅は次回のために保存されます。";
}
["r-from","r-to","r-time"].forEach(id=>$(id).addEventListener("input",updateRoute));
$("r-type").addEventListener("change",updateRoute);
$("r-from").addEventListener("change",()=>{try{localStorage.setItem(FROMKEY,$("r-from").value.trim())}catch(e){}});
$("f-place").addEventListener("input",()=>{if(!$("routeBox").hidden){$("r-to").value=$("f-place").value.trim();updateRoute()}});
$("f-start").addEventListener("input",()=>{if(!$("routeBox").hidden&&$("r-type").value!=="now"){$("r-time").value=$("f-start").value;updateRoute()}});
$("form").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const s=$("f-start").value,en=$("f-end").value;
  if(en&&!s){return showErr("終了時刻だけでなく開始時刻も入れてください。")}
  const sd=$("f-date").value,ed=$("f-enddate").value;
  if(ed&&ed<sd){return showErr("終了日は開始日と同じか、それより後にしてください。")}
  const multi=ed&&ed>sd;
  if(!multi&&s&&en&&en<s){return showErr("終了時刻は開始時刻より後にしてください。")}
  const data={id:editing?.id||("e"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
    title:$("f-title").value.trim(),date:sd,endDate:multi?ed:"",start:s,end:en,place:$("f-place").value.trim(),
    memo:$("f-memo").value.trim(),cat:(document.querySelector('input[name="cat"]:checked')||{}).value||"lab"};
  if(!data.title)return showErr("タイトルを入力してください。");
  try{await store.put(data);sel=data.date;const d=parse(data.date);view=new Date(d.getFullYear(),d.getMonth(),1);closeForm();render()}
  catch(e){showErr("保存できませんでした。通信状態を確認してもう一度お試しください。")}
});
$("delBtn").onclick=async()=>{
  const b=$("delBtn");
  if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="本当に削除";setTimeout(()=>{b.dataset.armed="";b.textContent="削除"},3000);return}
  try{await store.del(editing.id);b.dataset.armed="";b.textContent="削除";closeForm()}catch(e){showErr("削除できませんでした。")}
};
function showErr(t){$("f-err").textContent=t;$("f-err").hidden=false}
$("cancelBtn").onclick=closeForm;
$("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeForm()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("overlay").hidden)closeForm()});
$("addBtn").onclick=()=>{if(store)openForm(null,sel)};
$("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
$("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
$("todayBtn").onclick=()=>{sel=today;view=new Date();view.setDate(1);render()};

/* ---------- 現在時刻・世界の時刻 ---------- */
const DEVICE_TZ=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||"Asia/Tokyo"}catch(e){return"Asia/Tokyo"}})();
const ZONES=[["","この端末の時刻"],["Asia/Tokyo","東京"],["Asia/Seoul","ソウル"],["Asia/Shanghai","北京・上海"],["Asia/Taipei","台北"],["Asia/Hong_Kong","香港"],
  ["Asia/Bangkok","バンコク"],["Asia/Singapore","シンガポール"],["Asia/Kolkata","デリー・ムンバイ"],["Asia/Dubai","ドバイ"],["Europe/Moscow","モスクワ"],
  ["Europe/London","ロンドン"],["Europe/Paris","パリ"],["Europe/Berlin","ベルリン"],["America/New_York","ニューヨーク"],["America/Chicago","シカゴ"],
  ["America/Los_Angeles","ロサンゼルス"],["Pacific/Honolulu","ホノルル"],["America/Sao_Paulo","サンパウロ"],["Australia/Sydney","シドニー"],["Pacific/Auckland","オークランド"],["UTC","協定世界時（UTC）"]];
const TZKEY="schedule-tz-v1";
let tz=(()=>{try{return localStorage.getItem(TZKEY)||""}catch(e){return""}})();
if(tz&&!ZONES.some(z=>z[0]===tz))tz="";
$("tzSel").innerHTML=ZONES.map(([v,n])=>`<option value="${v}">${n}</option>`).join("");
$("tzSel").value=tz;
$("tzSel").onchange=()=>{tz=$("tzSel").value;try{localStorage.setItem(TZKEY,tz)}catch(e){}tick()};
function offsetMin(zone,d){
  try{const p=new Intl.DateTimeFormat("en-US",{timeZone:zone,timeZoneName:"shortOffset"}).formatToParts(d).find(x=>x.type==="timeZoneName").value;
    const m=p.match(/GMT([+-])(\d{1,2})(?::(\d{2}))?/);return m?(m[1]==="-"?-1:1)*(+m[2]*60+(+m[3]||0)):0}catch(e){return 0}
}
function tick(){
  const now=new Date(),zone=tz||DEVICE_TZ;
  const parts=Object.fromEntries(new Intl.DateTimeFormat("ja-JP",{timeZone:zone,hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(now).map(x=>[x.type,x.value]));
  $("clockTime").innerHTML=`${parts.hour}:${parts.minute}<small>${parts.second}</small>`;
  $("clockDate").textContent=new Intl.DateTimeFormat("ja-JP",{timeZone:zone,year:"numeric",month:"long",day:"numeric",weekday:"short"}).format(now)+(tz?"":"　"+zone);
  if(tz){const diff=(offsetMin(zone,now)-offsetMin(DEVICE_TZ,now))/60;
    const off=offsetMin(zone,now)/60;
    $("tzDiff").textContent=`UTC${off>=0?"+":""}${off}`+(diff===0?"・この端末と同じ":`・この端末より${diff>0?"+":""}${diff}時間`);
  }else $("tzDiff").textContent="";
}
tick();setInterval(tick,1000);

/* ---------- 現在地 ---------- */
const LOCKEY="schedule-loc-v1";
function showLoc(o){
  const t=new Date(o.at);
  $("locText").innerHTML="";$("locText").textContent=o.text;
  const sm=document.createElement("small");sm.textContent=`${t.getMonth()+1}/${t.getDate()} ${pad(t.getHours())}:${pad(t.getMinutes())}時点`;$("locText").appendChild(sm);
  $("locBtn").textContent="更新";
}
try{const o=JSON.parse(localStorage.getItem(LOCKEY)||"null");if(o&&o.text)showLoc(o)}catch(e){}
async function placeName(lat,lon){
  try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ja`);
    if(!r.ok)throw 0;const j=await r.json();
    const name=[j.countryCode&&j.countryCode!=="JP"?j.countryName:"",j.principalSubdivision,j.city,j.locality].filter(Boolean);
    const uniq=name.filter((x,i)=>name.indexOf(x)===i).join(" ");
    if(uniq)return uniq;
  }catch(e){}
  return `緯度 ${lat.toFixed(3)}, 経度 ${lon.toFixed(3)}`;
}
function getLocation(){
  if(!("geolocation" in navigator)){$("locText").textContent="この端末では位置情報を使えません";return}
  $("locBtn").disabled=true;$("locText").textContent="現在地を取得しています…";
  navigator.geolocation.getCurrentPosition(async pos=>{
    const text=await placeName(pos.coords.latitude,pos.coords.longitude);
    const o={text,at:Date.now()};try{localStorage.setItem(LOCKEY,JSON.stringify(o))}catch(e){}
    showLoc(o);$("locBtn").disabled=false;
  },err=>{
    $("locText").textContent=err.code===1?"位置情報が許可されていません。端末の設定でこのアプリ（ブラウザ）の位置情報をオンにしてください":"現在地を取得できませんでした。電波のよい場所でもう一度お試しください";
    $("locBtn").disabled=false;$("locBtn").textContent="もう一度";
  },{enableHighAccuracy:false,timeout:15000,maximumAge:300000});
}
$("locBtn").onclick=getLocation;
// 以前に許可済みなら、開いたときに自動で更新する
try{navigator.permissions&&navigator.permissions.query({name:"geolocation"}).then(p=>{if(p.state==="granted")getLocation()}).catch(()=>{})}catch(e){}

$("nowInfo").innerHTML=infoLinksHTML(["JR","東武"],true);

  const jr=Object.keys(RAIL.jrKm),td=Object.keys(RAIL.tobuKm).filter(x=>x!=="柏");

  $("fa-from").onchange=calc;$("fa-to").onchange=calc;
  $("fa-swap").onclick=()=>{const a=$("fa-from").value;$("fa-from").value=$("fa-to").value;$("fa-to").value=a;calc()};
  $("fareBtn").onclick=()=>{calc();$("fareOverlay").hidden=false};

  document.addEventListener("keydown",e=>{if(e.key==="Escape")$("fareOverlay").hidden=true});
})();

init();
